# Configurazione per i test automatici: H2 in-memory, nessuna connessione al DB remoto.
# Questo file sostituisce integralmente src/main/resources/application.yml durante i test.
spring:
  datasource:
    url: jdbc:h2:mem:aether;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Nei test lo schema H2 viene generato dalle entity (le migration
      # V1/V2 sono in dialetto PostgreSQL e non girano su H2)
      ddl-auto: update
  # Flyway disattivato sui test: si attivera' solo in dev/produzione
  flyway:
    enabled: false

server:
  port: 0
