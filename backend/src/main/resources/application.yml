spring:
  application:
    name: aether-backend
  profiles:
    active: dev

---
# Profilo di Sviluppo (PostgreSQL su Supabase)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Session Mode (porta 5432). Se usi il Transaction Pooler (6543) aggiungi
    # prepareThreshold=0 all'URL: i prepared statement lato server non sono compatibili.
    url: ${DB_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres.uswqqwtlcpkbxydczkyr}
    # Nessun valore di default: impostare la variabile d'ambiente DB_PASSWORD
    password: ${DB_PASSWORD:postgresits.}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always