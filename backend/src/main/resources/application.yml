spring:
  application:
    name: aether-backend
  profiles:
    active: dev

---
# Profilo di Sviluppo (PostgreSQL su Supabase)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # 1. Porta cambiata a 6543 (Transaction Mode) per evitare EMAXCONNSESSION
    url: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres.uswqqwtlcpkbxydczkyr}
    password: ${DB_PASSWORD:postgresits.}
    # 2. Limitazione della dimensione del pool di connessioni locale
    hikari:
      maximum-pool-size: 5
  jpa:
    # 3. 'database-platform' rimosso: Hibernate 6 rileva il dialetto in automatico
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always