<div class="asset-form-container">
  <div class="form-section">
    <h1>Gestione Asset</h1>

    <!-- Messaggio di successo -->
    <div *ngIf="creato" class="alert alert-success">
      {{ creato }}
    </div>

    <!-- Messaggio di errore -->
    <div *ngIf="errore" class="alert alert-error">
      {{ errore }}
    </div>

    <!-- Form di creazione/aggiornamento -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <div class="form-group">
        <label for="codice">Codice:</label>
        <input
          id="codice"
          type="text"
          formControlName="codice"
          class="form-control"
          [class.is-invalid]="f['codice'].invalid && f['codice'].touched"
          placeholder="Es. AS001"
        />
        <span *ngIf="f['codice'].invalid && f['codice'].touched" class="error-text">
          Codice è obbligatorio
        </span>
      </div>

      <div class="form-group">
        <label for="nome">Nome:</label>
        <input
          id="nome"
          type="text"
          formControlName="nome"
          class="form-control"
          [class.is-invalid]="f['nome'].invalid && f['nome'].touched"
          placeholder="Es. Server Database"
        />
        <span *ngIf="f['nome'].invalid && f['nome'].touched" class="error-text">
          Nome è obbligatorio
        </span>
      </div>

      <div class="form-group">
        <label for="criticita">Criticità di Default:</label>
        <select
          id="criticita"
          formControlName="criticita_di_default"
          class="form-control"
          [class.is-invalid]="f['criticita_di_default'].invalid && f['criticita_di_default'].touched"
        >
          <option *ngFor="let option of prioritaOptions" [value]="option">
            {{ option }}
          </option>
        </select>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          [disabled]="submitting"
          class="btn btn-primary"
        >
          {{ submitting ? 'Salvataggio in corso...' : 'Aggiungi/Aggiorna Asset' }}
        </button>
      </div>
    </form>
  </div>

  <!-- Lista degli asset esistenti -->
  <div class="assets-list-section">
    <h2>Asset Esistenti</h2>
    <div *ngIf="assets.length === 0" class="no-assets">
      Nessun asset disponibile
    </div>
    <div *ngIf="assets.length > 0" class="assets-table">
      <table>
        <thead>
          <tr>
            <th>Codice</th>
            <th>Nome</th>
            <th>Criticità Default</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let asset of assets">
            <td>{{ asset.codice }}</td>
            <td>{{ asset.nome }}</td>
            <td>
              <span class="badge" [ngClass]="'badge-' + asset.criticita_di_default.toLowerCase()">
                {{ asset.criticita_di_default }}
              </span>
            </td>
            <td>
              <button
                type="button"
                (click)="deleteAsset(asset.id_tipo_asset)"
                class="btn btn-danger btn-sm"
              >
                Elimina
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
